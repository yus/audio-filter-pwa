<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Filter</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .container {
            margin: 5px;
        }
        
        .panel {
            background: #2a2a2a;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #3a3a3a;
        }
        
        h3 {
            color: #88c0d0;
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        
        .btn-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #3a3a3a;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #4a4a4a;
        }
        
        button.active {
            background: #667eea;
        }
        
        #playBtn { background: #38a169; }
        #stopBtn { background: #e53e3e; }
        #uploadBtn { background: #48bb78; }
        #processBtn { background: #667eea; }
        #resetBtn { background: #718096; }
        
        .slider-group {
            margin: 10px 0;
        }
        
        .slider-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #3a3a3a;
            outline: none;
        }
        
        .visualizer {
            width: 100%;
            height: 150px;
            background: #1a1a1a;
            border-radius: 4px;
            margin: 10px 0;
            border: 1px solid #3a3a3a;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #48bb78;
            min-height: 20px;
        }
    </style>
    <script>
    // OVERRIDE - Delete old broken app
    if (window.AudioFilterApp) {
        console.log('Deleting old broken app...');
        delete window.AudioFilterApp;
    }
    
    // Simple working version
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Hotfix loaded');
        
        // Simple upload function
        window.uploadAudio = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';
            input.onchange = async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                alert('File selected: ' + file.name);
                // Add your upload logic here
            };
            input.click();
        };
        
        // Attach to button
        const uploadBtn = document.getElementById('uploadBtn');
        if (uploadBtn) {
            uploadBtn.onclick = window.uploadAudio;
            console.log('Upload button fixed');
        }
    });
    </script>
</head>
<body>
    <div class="container">
        <h1>AF</h1>
        
        <div class="panel">
            <h3>FILTER</h3>
            <div class="btn-group"></div>
            <!-- Toolbar -->
            <div class="toolbar">
                <button id="undoBtn" data-tooltip="Undo (Ctrl+Z)">↩ Undo</button>
                <button id="redoBtn" data-tooltip="Redo (Ctrl+Y)">↪ Redo</button>
                <button id="zoomInBtn" data-tooltip="Zoom In (+)">🔍+</button>
                <button id="zoomOutBtn" data-tooltip="Zoom Out (-)">🔍-</button>
                <button id="fitViewBtn" data-tooltip="Fit View (0)">⊞ Fit</button>
            </div>
            
            <!-- Filter Tabs -->
            <div id="filterTabs" class="filter-tabs"></div>
            
            <!-- Filter Controls -->
            <div id="filterControls"></div>
            
            <!-- Filter Response -->
            <canvas id="filterResponse" class="filter-response" width="800" height="80"></canvas>
            
            <!-- Keep cutoff slider separate -->
            <div class="slider-group">
                <label>Cutoff Frequency: <span id="cutoffValue">1000</span> Hz</label>
                <input type="range" id="cutoffFreq" min="20" max="20000" step="10" value="1000">
            </div>
        </div>
        
        <div class="panel">
            <div class="visualizer">
                <!-- Waveform -->
                <canvas id="waveVisualizer" width="800" height="200"></canvas>
            </div>
            <div id="status" class="status-bar" style="margin: 5px; padding: 5px; border-radius: 4px; background: #2a2a2a; min-height: 40px;"></div>
            <!-- Progress Bar Container -->
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>
        
        <div class="panel">
            <div class="btn-group">
                <!-- Iconified Bottom Toolbar -->
                <div class="bottom-toolbar">
                    <button id="uploadBtn" data-tooltip="Upload Audio">
                        <span class="icon">📤</span>
                        <span>Upload</span>
                    </button>
                    <button id="processBtn" data-tooltip="Process with Filters">
                        <span class="icon">⚙️</span>
                        <span>Process</span>
                    </button>
                    <button id="playBtn" data-tooltip="Play (Space)">
                        <span class="icon">▶️</span>
                        <span>Play</span>
                    </button>
                    <button id="stopBtn" data-tooltip="Stop">
                        <span class="icon">⏹️</span>
                        <span>Stop</span>
                    </button>
                    <button id="resetBtn" data-tooltip="Reset All">
                        <span class="icon">🔄</span>
                        <span>Reset</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app-fixed.js?v=1"></script>
</body>
</html>
